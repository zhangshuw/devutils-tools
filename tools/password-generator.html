  <style>
    .pwd-output { display:flex; align-items:center; gap:var(--space-md); }
    .pwd-output .textarea { flex:1; min-height:auto; font-size:1.25rem; letter-spacing:2px; text-align:center; padding:var(--space-md); }
    .options { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:var(--space-md); margin:var(--space-lg) 0; }
    .option-group { display:flex; flex-direction:column; gap:var(--space-sm); }
    .option-group label { font-size:var(--text-sm); color:var(--color-text-secondary); }
    .strength-bar { height:6px; border-radius:3px; background:var(--color-border); overflow:hidden; margin-top:var(--space-sm); }
    .strength-fill { height:100%; border-radius:3px; transition:width .3s,background .3s; }
    .batch-list { display:flex; flex-direction:column; gap:var(--space-sm); }
    .batch-item { display:flex; align-items:center; gap:var(--space-sm); }
    .batch-item code { flex:1; background:var(--color-bg-alt); padding:var(--space-sm) var(--space-md); border-radius:var(--radius-sm); font-family:monospace; font-size:var(--text-sm); word-break:break-all; }
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <main class="container">
    <nav class="breadcrumb"><a href="../index.html">首页</a><span class="breadcrumb-sep">/</span><span>密码生成器</span></nav>
    <h1>密码生成器</h1>
    <p style="color:var(--color-text-secondary);margin-bottom:var(--space-lg)">生成高强度随机密码，自定义长度和字符组合</p>
    <div>
      <div class="panel">
        <div class="pwd-output">
          <input type="text" id="pwdDisplay" class="input" readonly style="font-family:monospace;font-size:1.25rem;letter-spacing:2px;text-align:center;">
          <button class="btn btn-primary" id="copyBtn">复制</button>
          <button class="btn" id="refreshBtn">刷新</button>
        </div>
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        <div style="display:flex;justify-content:space-between;margin-top:var(--space-xs)">
          <span id="strengthText" style="font-size:var(--text-xs);color:var(--color-text-muted)"></span>
          <span id="entropyText" style="font-size:var(--text-xs);color:var(--color-text-muted)"></span>
        </div>
      </div>

      <div class="options">
        <div class="option-group">
          <label>密码长度：<strong id="lenVal">16</strong></label>
          <input type="range" id="pwdLen" min="4" max="128" value="16">
        </div>
        <div class="option-group">
          <label>生成数量：<strong id="countVal">1</strong></label>
          <input type="range" id="pwdCount" min="1" max="20" value="1">
        </div>
      </div>

      <div class="panel" style="margin-top:var(--space-md)">
        <div class="panel-header"><span class="panel-title">字符选项</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--space-sm)">
          <label style="display:flex;align-items:center;gap:var(--space-sm);cursor:pointer">
            <input type="checkbox" id="optUpper" checked> 大写字母 (A-Z)
          </label>
          <label style="display:flex;align-items:center;gap:var(--space-sm);cursor:pointer">
            <input type="checkbox" id="optLower" checked> 小写字母 (a-z)
          </label>
          <label style="display:flex;align-items:center;gap:var(--space-sm);cursor:pointer">
            <input type="checkbox" id="optDigit" checked> 数字 (0-9)
          </label>
          <label style="display:flex;align-items:center;gap:var(--space-sm);cursor:pointer">
            <input type="checkbox" id="optSymbol" checked> 特殊符号 (!@#$...)
          </label>
          <label style="display:flex;align-items:center;gap:var(--space-sm);cursor:pointer">
            <input type="checkbox" id="optExcludeAmb"> 排除歧义字符 (0OlI1)
          </label>
        </div>
      </div>

      <div id="batchArea" class="panel" style="margin-top:var(--space-md);display:none">
        <div class="panel-header"><span class="panel-title">批量密码</span></div>
        <div class="batch-list" id="batchList"></div>
      </div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    const CHARS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      digit: '0123456789',
      symbol: '!@#$%^&*()_+-=[]{}|;:,.<>?'
    };
    const AMBIGUOUS = '0OlI1';

    function getCharset() {
      let pool = '';
      if (document.getElementById('optUpper').checked) pool += CHARS.upper;
      if (document.getElementById('optLower').checked) pool += CHARS.lower;
      if (document.getElementById('optDigit').checked) pool += CHARS.digit;
      if (document.getElementById('optSymbol').checked) pool += CHARS.symbol;
      if (document.getElementById('optExcludeAmb').checked) pool = pool.split('').filter(c => !AMBIGUOUS.includes(c)).join('');
      return pool || 'abcdefghijklmnopqrstuvwxyz';
    }

    function generatePwd(len, pool) {
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      return Array.from(arr, v => pool[v % pool.length]).join('');
    }

    function getStrength(len, poolLen) {
      const entropy = len * Math.log2(poolLen);
      if (entropy < 40) return { text: '弱', color: '#ef4444', pct: 20 };
      if (entropy < 60) return { text: '一般', color: '#f97316', pct: 40 };
      if (entropy < 80) return { text: '较强', color: '#eab308', pct: 60 };
      if (entropy < 100) return { text: '强', color: '#22c55e', pct: 80 };
      return { text: '非常强', color: '#16a34a', pct: 100 };
    }

    function update() {
      const len = +document.getElementById('pwdLen').value;
      const count = +document.getElementById('pwdCount').value;
      document.getElementById('lenVal').textContent = len;
      document.getElementById('countVal').textContent = count;
      const pool = getCharset();
      const pwd = generatePwd(len, pool);
      document.getElementById('pwdDisplay').value = pwd;

      const s = getStrength(len, pool.length);
      document.getElementById('strengthFill').style.width = s.pct + '%';
      document.getElementById('strengthFill').style.background = s.color;
      document.getElementById('strengthText').textContent = '强度：' + s.text;
      const entropy = Math.round(len * Math.log2(pool.length));
      document.getElementById('entropyText').textContent = `${entropy} bits 熵`;

      const batch = document.getElementById('batchArea');
      const list = document.getElementById('batchList');
      if (count > 1) {
        batch.style.display = '';
        let html = '';
        for (let i = 0; i < count; i++) {
          html += `<div class="batch-item"><code>${generatePwd(len, pool)}</code><button class="btn btn-sm btn-ghost" data-copy>复制</button></div>`;
        }
        list.innerHTML = html;
        list.querySelectorAll('[data-copy]').forEach((btn, i) => {
          btn.addEventListener('click', () => copyToClipboard(list.querySelectorAll('code')[i].textContent));
        });
      } else {
        batch.style.display = 'none';
      }
    }

    document.getElementById('copyBtn').addEventListener('click', () => {
      copyToClipboard(document.getElementById('pwdDisplay').value);
    });
    document.getElementById('refreshBtn').addEventListener('click', update);
    document.getElementById('pwdLen').addEventListener('input', update);
    document.getElementById('pwdCount').addEventListener('input', update);
    ['optUpper','optLower','optDigit','optSymbol','optExcludeAmb'].forEach(id => {
      document.getElementById(id).addEventListener('change', update);
    });

    update();
  </script>
</body>
</html>
