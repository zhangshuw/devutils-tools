            <button class="btn" data-angle="135">↘ 右下</button>

          </div>

        <!-- 色标 -->
        <div class="controls-section">
          <div class="section-label">色标</div>
          <div class="color-stops-list" id="colorStopsList"></div>
          <button class="btn add-stop-btn" id="addStopBtn">+ 添加色标</button>
        </div>

          <div class="section-label">CSS代码</div>

  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    // 状态
    let gradientType = "linear"; // linear | radial
    let angle = 180;
    let colorStops = [
      { color: "#3b82f6", position: 0 },
      { color: "#8b5cf6", position: 50 },
      { color: "#ec4899", position: 100 },
    ];

    const preview = document.getElementById("gradientPreview");
    const cssCodeEl = document.getElementById("cssCode");
    const angleSlider = document.getElementById("angleSlider");
    const angleDisplay = document.getElementById("angleDisplay");
    const colorStopsList = document.getElementById("colorStopsList");
    const dirPresets = document.getElementById("dirPresets");
    const directionSection = document.getElementById("directionSection");

    // 生成渐变CSS
    function buildGradientCSS() {
      const stops = [...colorStops]
        .sort((a, b) => a.position - b.position)
        .map(s => `${s.color} ${s.position}%`)
        .join(", ");

      if (gradientType === "linear") {
        return `linear-gradient(${angle}deg, ${stops})`;
      }
      return `radial-gradient(circle, ${stops})`;
    }

    // 更新预览和代码
    function updatePreview() {
      const css = buildGradientCSS();
      preview.style.background = css;
      cssCodeEl.textContent = `background: ${css};`;
    }

    // 渲染色标列表
    function renderColorStops() {
      colorStopsList.innerHTML = colorStops.map((stop, i) => `
        <div class="color-stop-item" data-index="${i}">
          <input type="color" value="${stop.color}" data-field="color">
          <span class="color-hex">${stop.color}</span>
          <input type="number" value="${stop.position}" min="0" max="100" data-field="position">
          <span style="font-size:0.85rem;color:var(--color-text-secondary)">%</span>
          ${colorStops.length > 2 ? `<button class="btn remove-stop" data-remove="${i}">删除</button>` : ""}
        </div>
      `).join("");
    }

    // 色标列表事件代理
    colorStopsList.addEventListener("input", (e) => {
      const item = e.target.closest(".color-stop-item");
      if (!item) return;
      const idx = parseInt(item.dataset.index);
      const field = e.target.dataset.field;
      if (field === "color") {
        colorStops[idx].color = e.target.value;
        item.querySelector(".color-hex").textContent = e.target.value;
      } else if (field === "position") {
        colorStops[idx].position = Math.max(0, Math.min(100, parseInt(e.target.value) || 0));
      }
      updatePreview();
    });

    colorStopsList.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-remove]");
      if (!btn) return;
      colorStops.splice(parseInt(btn.dataset.remove), 1);
      renderColorStops();
      updatePreview();
    });

    // 添加色标
    document.getElementById("addStopBtn").addEventListener("click", () => {
      // 在最后两个色标之间插入
      const last = colorStops[colorStops.length - 1];
      const prev = colorStops[colorStops.length - 2];
      const newPos = Math.round((last.position + prev.position) / 2);
      // 随机颜色
      const randColor = "#" + Math.floor(Math.random() * 16777215).toString(16).padStart(6, "0");
      colorStops.push({ color: randColor, position: newPos });
      // 重新排序
      colorStops.sort((a, b) => a.position - b.position);
      renderColorStops();
      updatePreview();
    });

    // 渐变类型切换
    document.getElementById("btnLinear").addEventListener("click", () => {
      gradientType = "linear";
      document.getElementById("btnLinear").classList.add("active");
      document.getElementById("btnRadial").classList.remove("active");
      directionSection.style.display = "";
      updatePreview();
    });

    document.getElementById("btnRadial").addEventListener("click", () => {
      gradientType = "radial";
      document.getElementById("btnRadial").classList.add("active");
      document.getElementById("btnLinear").classList.remove("active");
      directionSection.style.display = "none";
      updatePreview();
    });

    // 角度滑块
    angleSlider.addEventListener("input", () => {
      angle = parseInt(angleSlider.value);
      angleDisplay.textContent = angle + "°";
      // 取消预设方向的高亮
      dirPresets.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      dirPresets.querySelector(`[data-angle="${angle}"]`)?.classList.add("active");
      updatePreview();
    });

    // 方向预设按钮
    dirPresets.addEventListener("click", (e) => {
      const btn = e.target.closest("[data-angle]");
      if (!btn) return;
      angle = parseInt(btn.dataset.angle);
      angleSlider.value = angle;
      angleDisplay.textContent = angle + "°";
      dirPresets.querySelectorAll("button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updatePreview();
    });

    // 复制代码
    document.getElementById("copyCodeBtn").addEventListener("click", () => {
      copyToClipboard(cssCodeEl.textContent);
    });

    // 初始化
    renderColorStops();
    updatePreview();
  </script>
