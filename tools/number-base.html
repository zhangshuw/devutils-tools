<script type="module">
import{initLayout,showToast,copyToClipboard}from'../js/layout.js';
initLayout();

const fields={2:document.getElementById('bin'),8:document.getElementById('oct'),10:document.getElementById('dec'),16:document.getElementById('hex')};
const customBase=document.getElementById('customBase');
const customInput=document.getElementById('custom');
const bitsEl=document.getElementById('bits');
let lastChanged=null;

function toBase(n,base){
  if(n<0)return '-'+toBase(-n,base);
  const digits='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if(base>digits.length)return n.toString(base);
  if(n===0)return '0';
  let s='';
  while(n>0){s=digits[n%base]+s;n=Math.floor(n/base);}
  return s;
}

function fromBase(str,base){
  const digits='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  str=str.toUpperCase().replace(/\s/g,'');
  if(!str||str==='-')return NaN;
  let neg=false;
  if(str[0]==='-'){neg=true;str=str.slice(1);}
  let n=0;
  for(const c of str){
    const v=digits.indexOf(c);
    if(v<0||v>=base)return NaN;
    n=n*base+v;
  }
  return neg?-n:n;
}

function isValid(str,base){
  const digits='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'.slice(0,base);
  const re=new RegExp('^-?['+digits+']+$','i');
  return re.test(str.replace(/\s/g,''));
}

function update(source){
  const base=parseInt(source.dataset.base||customBase.value);
  const val=source.value.trim();
  if(!val){Object.values(fields).forEach(f=>{if(f!==source)f.value='';});customInput.value='';updateBits(0);return;}
  const num=parseInt(source.dataset.base)?fromBase(val,base):NaN;
  if(isNaN(num)||!isValid(val,base)){source.style.borderColor='var(--color-error)';return;}
  source.style.borderColor='';
  for(const[b,el]of Object.entries(fields)){
    if(el!==source)el.value=toBase(num,parseInt(b));
  }
  const cb=parseInt(customBase.value);
  customInput.value=toBase(num,cb);
  updateBits(num);
}

function updateFromCustom(){
  const cb=parseInt(customBase.value);
  const val=customInput.value.trim();
  if(!val){Object.values(fields).forEach(f=>f.value='');updateBits(0);return;}
  const num=fromBase(val,cb);
  if(isNaN(num)){customInput.style.borderColor='var(--color-error)';return;}
  customInput.style.borderColor='';
  for(const[b,el]of Object.entries(fields)){
    el.value=toBase(num,parseInt(b));
  }
  updateBits(num);
}

function updateBits(n){
  if(n<0||n>255){bitsEl.innerHTML='<span style="color:var(--color-text-muted);font-size:var(--text-sm)">超出8位范围 (0-255)</span>';return;}
  bitsEl.innerHTML='';
  for(let i=7;i>=0;i--){
    if(i===3){const s=document.createElement('span');s.className='sep';s.textContent='·';bitsEl.appendChild(s);}
    const b=document.createElement('span');
    b.className='bit '+(n&(1<<i)?'on':'off');
    b.textContent=n&(1<<i)?'1':'0';
    b.onclick=()=>{const nv=n^(1<<i);setFromDec(nv);};
    bitsEl.appendChild(b);
  }
}

function setFromDec(n){
  for(const[b,el]of Object.entries(fields))el.value=toBase(n,parseInt(b));
  const cb=parseInt(customBase.value);customInput.value=toBase(n,cb);
  updateBits(n);
}

Object.values(fields).forEach(el=>el.addEventListener('input',()=>update(el)));
customInput.addEventListener('input',updateFromCustom);
customBase.addEventListener('change',()=>{
  const dec=fields[10].value.trim();
  if(dec){const n=fromBase(dec,10);if(!isNaN(n))customInput.value=toBase(n,parseInt(customBase.value));}
});

window.clearAll=()=>{Object.values(fields).forEach(f=>f.value='');customInput.value='';updateBits(0);};
window.copyResult=()=>{const r=[`BIN: ${fields[2].value}`,`OCT: ${fields[8].value}`,`DEC: ${fields[10].value}`,`HEX: ${fields[16].value}`].join('\n');copyToClipboard(r);};
updateBits(0);
</script>
