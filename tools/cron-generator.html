  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    const DAYS = ['日','一','二','三','四','五','六'];

    function describeCron(min, hour, day, month, dow) {
      const p = [min, hour, day, month, dow];
      if (p.every(v => v === '*')) return '每分钟执行';
      if (min.startsWith('*/')) return `每${min.slice(2)}分钟执行`;
      if (min === '0' && hour.startsWith('*/')) return `每${hour.slice(2)}小时整执行`;
      if (min === '0' && hour === '*' && day === '*' && month === '*' && dow === '*') return '每小时整执行';
      if (min === '0' && hour !== '*' && day === '*' && month === '*' && dow === '*') return `每天 ${hour.padStart(2,'0')}:${min.padStart(2,'0')} 执行`;
      if (min === '0' && hour !== '*' && dow !== '*' && dow.includes('-')) return `工作日 ${hour.padStart(2,'0')}:00 执行`;
      if (min === '0' && hour !== '*' && dow !== '*') return `每星期${DAYS[parseInt(dow)] || dow} ${hour.padStart(2,'0')}:00 执行`;
      if (min === '0' && hour === '0' && day !== '*' && month === '*' && dow === '*') return `每月${day}号零点执行`;
      return `${min} ${hour} ${day} ${month} ${dow}`;
    }

    function computeNextRuns(expr, count = 5) {
      const parts = expr.split(/\s+/);
      if (parts.length !== 5) return [];
      const now = new Date();
      const runs = [];
      let d = new Date(now.getTime() + 60000);
      d.setSeconds(0, 0);
      while (runs.length < count && d < new Date(now.getTime() + 365*24*3600*1000)) {
        if (matches(parts, d)) {
          runs.push(new Date(d));
          d = new Date(d.getTime() + 60000);
        } else {
          d = new Date(d.getTime() + 60000);
        }
        if (runs.length === 0 && d > new Date(now.getTime() + 86400000*32)) break;
      }
      return runs;
    }

    function matches(parts, d) {
      const [minP, hourP, dayP, monthP, dowP] = parts;
      return matchField(minP, d.getMinutes()) &&
             matchField(hourP, d.getHours()) &&
             matchField(dayP, d.getDate()) &&
             matchField(monthP, d.getMonth()+1) &&
             matchField(dowP, d.getDay());
    }

    function matchField(pattern, value) {
      if (pattern === '*') return true;
      for (const part of pattern.split(',')) {
        if (part.startsWith('*/')) {
          const step = parseInt(part.slice(2));
          if (step > 0 && value % step === 0) return true;
        } else if (part.includes('-')) {
          const [s, e] = part.split('-').map(Number);
          if (value >= s && value <= e) return true;
        } else {
          if (parseInt(part) === value) return true;
        }
      }
      return false;
    }

    function update() {
      const min = document.getElementById('cronMin').value.trim() || '*';
      const hour = document.getElementById('cronHour').value.trim() || '*';
      const day = document.getElementById('cronDay').value.trim() || '*';
      const month = document.getElementById('cronMonth').value.trim() || '*';
      const dow = document.getElementById('cronDow').value.trim() || '*';
      const expr = `${min} ${hour} ${day} ${month} ${dow}`;
      document.getElementById('cronExpr').textContent = expr;
      document.getElementById('humanDesc').textContent = describeCron(min, hour, day, month, dow);
      const runs = computeNextRuns(expr);
      const list = document.getElementById('nextRuns');
      list.innerHTML = runs.length
        ? runs.map(d => `<li>${d.toLocaleString('zh-CN')}</li>`).join('')
        : '<li style="color:var(--color-text-muted)">无法计算下次执行时间</li>';
    }

    document.querySelectorAll('.cron-part input').forEach(inp => inp.addEventListener('input', update));
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const parts = btn.dataset.cron.split(' ');
        document.getElementById('cronMin').value = parts[0];
        document.getElementById('cronHour').value = parts[1];
        document.getElementById('cronDay').value = parts[2];
        document.getElementById('cronMonth').value = parts[3];
        document.getElementById('cronDow').value = parts[4];
        update();
      });
    });
    document.getElementById('copyExprBtn').addEventListener('click', () => {
      copyToClipboard(document.getElementById('cronExpr').textContent);
    });
    update();
  </script>
