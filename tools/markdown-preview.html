    <div>

          <button class="btn btn-sm" id="exampleBtn">加载示例</button>
          <button class="btn btn-sm" id="copyHtmlBtn">复制HTML</button>

  <script src="https://cdn.jsdelivr.net/npm/marked@14.1.2/marked.min.js"></script>
  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    const input = document.getElementById('mdInput');
    const preview = document.getElementById('mdPreview');
    let timer;

    function render() {
      if (typeof marked !== 'undefined') {
        preview.innerHTML = marked.parse(input.value || '');
      } else {
        preview.textContent = input.value;
      }
    }

    input.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(render, 200);
    });

    document.getElementById('exampleBtn').addEventListener('click', () => {
      input.value = `# Markdown 预览示例

      render();
    });

    document.getElementById('copyHtmlBtn').addEventListener('click', () => {
      copyToClipboard(preview.innerHTML);
    });

    document.getElementById('clearMdBtn').addEventListener('click', () => {
      input.value = '';
      preview.innerHTML = '';
    });

    // 初始渲染
    render();
  </script>
