<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL编解码 - 在线开发者工具 | DevUtils</title>
  <meta name="description" content="在线URL编码与解码工具，支持组件编码和完整URL编码。">
  <link rel="canonical" href="https://devutils.cn/tools/url-encode.html">
  <!-- OG tags -->
  <script type="application/ld+json">
  {"@context":"https://schema.org","@type":"SoftwareApplication","name":"URL编解码","applicationCategory":"DeveloperApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0"}}
  </script>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="siteHeader"></div>
  <div id="adHeader"></div>
  <main class="container">
    <nav class="breadcrumb"><a href="../index.html">首页</a><span class="breadcrumb-sep">/</span><span>URL编解码</span></nav>
    <h1>URL编解码</h1>
    <p style="color:var(--color-text-secondary);margin-bottom:var(--space-lg)">在线URL编码与解码，支持组件编码（encodeURIComponent）和完整URL编码（encodeURI）。</p>
    <div class="page-layout">
      <div class="tool-content">
        <!-- 标签页 -->
        <div class="tabs">
          <button class="tab-btn active" data-tab="component">编码组件</button>
          <button class="tab-btn" data-tab="uri">编码完整URL</button>
          <button class="tab-btn" data-tab="decode">解码</button>
        </div>
        <!-- 编码组件面板 -->
        <div class="tab-panel active" id="panel-component">
          <div class="tool-layout">
            <div class="panel">
              <div class="panel-header"><span class="panel-title">原始文本</span></div>
              <textarea class="textarea" id="compInput" placeholder="输入要编码的URL组件..."></textarea>
            </div>
            <div class="panel">
              <div class="panel-header">
                <span class="panel-title">编码结果</span>
                <button class="btn btn-sm" id="copyComp">复制</button>
              </div>
              <textarea class="textarea" id="compOutput" readonly placeholder="编码结果..."></textarea>
            </div>
          </div>
        </div>
        <!-- 编码完整URL面板 -->
        <div class="tab-panel" id="panel-uri">
          <div class="tool-layout">
            <div class="panel">
              <div class="panel-header"><span class="panel-title">原始URL</span></div>
              <textarea class="textarea" id="uriInput" placeholder="输入要编码的完整URL..."></textarea>
            </div>
            <div class="panel">
              <div class="panel-header">
                <span class="panel-title">编码结果</span>
                <button class="btn btn-sm" id="copyUri">复制</button>
              </div>
              <textarea class="textarea" id="uriOutput" readonly placeholder="编码结果..."></textarea>
            </div>
          </div>
        </div>
        <!-- 解码面板 -->
        <div class="tab-panel" id="panel-decode">
          <div class="tool-layout">
            <div class="panel">
              <div class="panel-header"><span class="panel-title">已编码文本</span></div>
              <textarea class="textarea" id="decInput" placeholder="输入要解码的URL编码文本..."></textarea>
            </div>
            <div class="panel">
              <div class="panel-header">
                <span class="panel-title">解码结果</span>
                <button class="btn btn-sm" id="copyDec">复制</button>
              </div>
              <textarea class="textarea" id="decOutput" readonly placeholder="解码结果..."></textarea>
            </div>
          </div>
        </div>
      </div>
      <aside>
        <div class="ad-slot ad-slot-sidebar" id="ad-sidebar"><span class="ad-placeholder">广告位</span></div>
      </aside>
    </div>
  </main>
  <div id="adFooter"></div>
  <div id="siteFooter"></div>
  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    // 标签页切换
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
      });
    });

    // 编码组件 - 实时转换
    const compInput = document.getElementById("compInput");
    const compOutput = document.getElementById("compOutput");
    compInput.addEventListener("input", () => {
      try {
        compOutput.value = compInput.value ? encodeURIComponent(compInput.value) : "";
      } catch (e) {
        compOutput.value = "";
        showToast("编码失败", true);
      }
    });

    // 编码完整URL - 实时转换
    const uriInput = document.getElementById("uriInput");
    const uriOutput = document.getElementById("uriOutput");
    uriInput.addEventListener("input", () => {
      try {
        uriOutput.value = uriInput.value ? encodeURI(uriInput.value) : "";
      } catch (e) {
        uriOutput.value = "";
        showToast("编码失败", true);
      }
    });

    // 解码 - 实时转换
    const decInput = document.getElementById("decInput");
    const decOutput = document.getElementById("decOutput");
    decInput.addEventListener("input", () => {
      try {
        decOutput.value = decInput.value ? decodeURIComponent(decInput.value) : "";
      } catch (e) {
        decOutput.value = "";
        showToast("解码失败：输入不是有效的URL编码", true);
      }
    });

    // 复制按钮
    document.getElementById("copyComp").addEventListener("click", () => {
      if (!compOutput.value) { showToast("没有可复制的内容", true); return; }
      copyToClipboard(compOutput.value);
    });
    document.getElementById("copyUri").addEventListener("click", () => {
      if (!uriOutput.value) { showToast("没有可复制的内容", true); return; }
      copyToClipboard(uriOutput.value);
    });
    document.getElementById("copyDec").addEventListener("click", () => {
      if (!decOutput.value) { showToast("没有可复制的内容", true); return; }
      copyToClipboard(decOutput.value);
    });
  </script>
</body>
</html>
