      <div class="stat-card"><div class="stat-value" id="cnCount">0</div><div class="stat-label">中文字数</div></div>
      <div class="stat-card"><div class="stat-value" id="enWordCount">0</div><div class="stat-label">英文词数</div></div>
      <div class="stat-card"><div class="stat-value" id="sentenceCount">0</div><div class="stat-label">句子数</div></div>
      <div class="stat-card"><div class="stat-value" id="paragraphCount">0</div><div class="stat-label">段落数</div></div>
      <div class="stat-card"><div class="stat-value" id="lineCount">0</div><div class="stat-label">行数</div></div>
      <div class="stat-card"><div class="stat-value" id="readTime">0 分</div><div class="stat-label">阅读时间</div></div>
    </div>

  <script type="module">
    import { initLayout } from "../js/layout.js";
    initLayout();

    const input = document.getElementById("inputText");
    const clearBtn = document.getElementById("clearBtn");

    function analyze(text) {
      if (!text.trim()) {
        return { charCount: 0, charNoSpace: 0, wordCount: 0, cnCount: 0, enWordCount: 0, sentenceCount: 0, paragraphCount: 0, lineCount: 0, readTimeMin: 0, keywords: [] };
      }

      // 字符数
      const charCount = text.length;
      const charNoSpace = text.replace(/\s/g, "").length;

      // 中文字数（CJK统一汉字范围）
      const cnChars = text.match(/[一-鿿㐀-䶿]/g) || [];
      const cnCount = cnChars.length;

      // 英文词数
      const enWords = text.match(/[a-zA-Z]+(?:['-][a-zA-Z]+)*/g) || [];
      const enWordCount = enWords.length;

      // 总词数 = 中文字数 + 英文词数
      const wordCount = cnCount + enWordCount;

      // 句子数（中英文句号、问号、叹号）
      const sentenceCount = (text.match(/[。！？.!?]+/g) || []).length || (wordCount > 0 ? 1 : 0);

      // 段落数
      const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim());
      const paragraphCount = paragraphs.length || (text.trim() ? 1 : 0);

      // 行数
      const lineCount = text.split("\n").length;

      // 阅读时间（中文 400字/分钟，英文 200词/分钟）
      const readTimeMin = Math.max(1, Math.ceil(cnCount / 400 + enWordCount / 200));

      // 高频词
      const freq = {};
      enWords.forEach(w => {
        const lw = w.toLowerCase();
        if (lw.length > 1) freq[lw] = (freq[lw] || 0) + 1;
      });
      cnChars.forEach(c => {
        freq[c] = (freq[c] || 0) + 1;
      });
      const keywords = Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 10);

      return { charCount, charNoSpace, wordCount, cnCount, enWordCount, sentenceCount, paragraphCount, lineCount, readTimeMin, keywords };
    }

    function update() {
      const r = analyze(input.value);
      document.getElementById("charCount").textContent = r.charCount;
      document.getElementById("charNoSpace").textContent = r.charNoSpace;
      document.getElementById("wordCount").textContent = r.wordCount;
      document.getElementById("cnCount").textContent = r.cnCount;
      document.getElementById("enWordCount").textContent = r.enWordCount;
      document.getElementById("sentenceCount").textContent = r.sentenceCount;
      document.getElementById("paragraphCount").textContent = r.paragraphCount;
      document.getElementById("lineCount").textContent = r.lineCount;
      document.getElementById("readTime").textContent = r.readTimeMin > 0 ? `${r.readTimeMin} 分` : "0 分";

      const kwSection = document.getElementById("keywordSection");
      const kwList = document.getElementById("keywordList");
      if (r.keywords.length > 0) {
        kwSection.style.display = "";
        kwList.innerHTML = r.keywords.map(([w, c]) => `<div class="keyword-item">${w}<span>×${c}</span></div>`).join("");
      } else {
        kwSection.style.display = "none";
      }
    }

    input.addEventListener("input", update);
    clearBtn.addEventListener("click", () => { input.value = ""; update(); input.focus(); });
  </script>
