  <script type="module">
    import { initLayout, showToast, copyToClipboard } from "../js/layout.js";
    initLayout();

    // HEX转RGB
    function hexToRgb(hex) {
      hex = hex.replace("#", "");
      if (hex.length === 3) hex = hex.split("").map(c => c + c).join("");
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      return { r, g, b };
    }

    // RGB转HSL
    function rgbToHsl(r, g, b) {
      r /= 255; g /= 255; b /= 255;
      const max = Math.max(r, g, b), min = Math.min(r, g, b);
      let h, s, l = (max + min) / 2;
      if (max === min) {
        h = s = 0;
      } else {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        switch (max) {
          case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
          case g: h = ((b - r) / d + 2) / 6; break;
          case b: h = ((r - g) / d + 4) / 6; break;
        }
      }
      return {
        h: Math.round(h * 360),
        s: Math.round(s * 100),
        l: Math.round(l * 100)
      };
    }

    // RGB转CMYK
    function rgbToCmyk(r, g, b) {
      if (r === 0 && g === 0 && b === 0) return { c: 0, m: 0, y: 0, k: 100 };
      const rr = r / 255, gg = g / 255, bb = b / 255;
      const k = 1 - Math.max(rr, gg, bb);
      const c = (1 - rr - k) / (1 - k);
      const m = (1 - gg - k) / (1 - k);
      const y = (1 - bb - k) / (1 - k);
      return {
        c: Math.round(c * 100),
        m: Math.round(m * 100),
        y: Math.round(y * 100),
        k: Math.round(k * 100)
      };
    }

    // 存储各格式值
    const values = { hex: "", rgb: "", hsl: "", cmyk: "" };

    // 从HEX更新所有值
    function updateFromHex(hex) {
      const rgb = hexToRgb(hex);
      const hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
      const cmyk = rgbToCmyk(rgb.r, rgb.g, rgb.b);

      values.hex = hex;
      values.rgb = `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
      values.hsl = `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`;
      values.cmyk = `cmyk(${cmyk.c}%, ${cmyk.m}%, ${cmyk.y}%, ${cmyk.k}%)`;

      document.getElementById("hexValue").textContent = values.hex;
      document.getElementById("rgbValue").textContent = values.rgb;
      document.getElementById("hslValue").textContent = values.hsl;
      document.getElementById("cmykValue").textContent = values.cmyk;
      document.getElementById("colorPreview").style.background = hex;
    }

    const hexInput = document.getElementById("hexInput");
    const colorPicker = document.getElementById("colorPicker");

    // HEX输入框变更
    hexInput.addEventListener("input", () => {
      let val = hexInput.value.trim();
      // 自动补#
      if (val && !val.startsWith("#")) val = "#" + val;
      // 验证格式
      if (/^#[0-9a-fA-F]{6}$/.test(val)) {
        colorPicker.value = val;
        updateFromHex(val);
      } else if (/^#[0-9a-fA-F]{3}$/.test(val)) {
        // 展开3位简写
        const expanded = "#" + val[1] + val[1] + val[2] + val[2] + val[3] + val[3];
        colorPicker.value = expanded;
        updateFromHex(expanded);
      }
    });

    // 拾色器变更
    colorPicker.addEventListener("input", () => {
      hexInput.value = colorPicker.value;
      updateFromHex(colorPicker.value);
    });

    // 复制按钮
    document.querySelectorAll("[data-copy]").forEach(btn => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.copy;
        if (values[key]) copyToClipboard(values[key]);
      });
    });

    // 初始化
    updateFromHex("#6366f1");
  </script>
